  <!-- Rambut Siswi Depan & Poni Rapi -->
  <path d="M140 170 C138 120, 165 102, 200 102 C235 102, 262 120, 260 170 C250 135, 230 118, 200 118 C170 118, 150 135, 140 170 Z" fill="#1E293B"/>
  <path d="M145 130 Q170 145 195 135 Q175 125 150 125 Z" fill="#1E293B"/>
  <path d="M205 135 Q230 145 255 130 Q250 125 225 125 Z" fill="#1E293B"/>

  <!-- Jepit Rambut Cantik Pink -->
  <rect x="145" y="140" width="16" height="5" rx="2.5" fill="#EC4899" transform="rotate(-15 145 140)"/>

  <!-- Alis & Mata Siswi -->
  <path d="M166 161 Q178 157 187 161" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M213 161 Q222 157 234 161" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="177" cy="172" r="5" fill="#0F172A"/>
  <circle cx="223" cy="172" r="5" fill="#0F172A"/>
  <circle cx="179" cy="170" r="1.5" fill="#FFFFFF"/>
  <circle cx="225" cy="170" r="1.5" fill="#FFFFFF"/>
  <circle cx="175" cy="174" r="0.8" fill="#FFFFFF"/>
  <circle cx="221" cy="174" r="0.8" fill="#FFFFFF"/>

  <!-- Hidung & Senyum -->
  <path d="M198 180 Q200 188 202 186" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M184 204 Q200 218 216 204" stroke="#BE185D" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Pipi Merah Alami -->
  <circle cx="166" cy="190" r="8" fill="#F472B6" opacity="0.4"/>
  <circle cx="234" cy="190" r="8" fill="#F472B6" opacity="0.4"/>
