<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="uniformTie2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg2)"/>
  <circle cx="200" cy="180" r="140" fill="#FFFFFF" opacity="0.6"/>

  <!-- Rambut Panjang di Belakang -->
  <path d="M135 170 C125 240, 125 320, 150 350 C165 310, 165 240, 160 210 Z" fill="#1E293B"/>
  <path d="M265 170 C275 240, 275 320, 250 350 C235 310, 235 240, 240 210 Z" fill="#1E293B"/>

  <!-- Body / Uniform (Kemeja Putih SMP) -->
  <path d="M100 400 C100 310, 140 280, 200 280 C260 280, 300 310, 300 400 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
  
  <!-- Kerah Kemeja -->
  <path d="M160 280 L200 320 L170 340 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M240 280 L200 320 L230 340 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Dasi Biru SMP -->
  <path d="M193 318 L207 318 L212 375 L200 395 L188 375 Z" fill="url(#uniformTie2)"/>
  
  <!-- Badge OSIS di Saku -->
  <rect x="130" y="340" width="30" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="135" y="346" width="20" height="12" rx="2" fill="#F59E0B"/>
  <circle cx="145" cy="365" r="5" fill="#A855F7"/>

  <!-- Leher -->
