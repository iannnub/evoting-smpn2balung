<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="uniformTie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1)"/>
  <circle cx="200" cy="180" r="140" fill="#FFFFFF" opacity="0.6"/>

  <!-- Body / Uniform (Kemeja Putih SMP) -->
  <path d="M100 400 C100 310, 140 280, 200 280 C260 280, 300 310, 300 400 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
  
  <!-- Kerah Kemeja -->
  <path d="M160 280 L200 320 L170 340 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M240 280 L200 320 L230 340 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Dasi Biru SMP -->
  <path d="M193 318 L207 318 L212 375 L200 395 L188 375 Z" fill="url(#uniformTie)"/>
  
  <!-- Badge OSIS di Saku -->
  <rect x="130" y="340" width="30" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="135" y="346" width="20" height="12" rx="2" fill="#F59E0B"/>
  <circle cx="145" cy="365" r="5" fill="#DB2777"/>

  <!-- Leher -->
  <rect x="180" y="235" width="40" height="50" rx="6" fill="#FCD34D"/>

  <!-- Kepala & Wajah -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#FDE68A"/>

  <!-- Rambut Siswa Laki-laki -->
  <path d="M142 165 C140 120, 165 105, 200 105 C235 105, 260 120, 258 165 C250 135, 230 120, 200 120 C170 120, 150 135, 142 165 Z" fill="#1E293B"/>
  <path d="M142 165 C138 180, 145 195, 148 195 C150 185, 150 170, 155 160 Z" fill="#1E293B"/>
  <path d="M258 165 C262 180, 255 195, 252 195 C250 185, 250 170, 245 160 Z" fill="#1E293B"/>

  <!-- Alis & Mata -->
  <path d="M165 160 Q178 156 188 160" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M212 160 Q222 156 235 160" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="177" cy="172" r="5" fill="#0F172A"/>
  <circle cx="223" cy="172" r="5" fill="#0F172A"/>
  <circle cx="179" cy="170" r="1.5" fill="#FFFFFF"/>
  <circle cx="225" cy="170" r="1.5" fill="#FFFFFF"/>

  <!-- Hidung & Senyum -->
  <path d="M197 180 Q200 190 203 188" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M182 205 Q200 220 218 205" stroke="#BE185D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Pipi Merah Alami -->
  <circle cx="165" cy="190" r="8" fill="#F472B6" opacity="0.35"/>
  <circle cx="235" cy="190" r="8" fill="#F472B6" opacity="0.35"/>
</svg>
